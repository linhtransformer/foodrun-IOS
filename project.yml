# XcodeGen spec — run `xcodegen generate` to (re)create Foodrun.xcodeproj.
# The .xcodeproj is generated and git-ignored; edit this file instead.
name: Foodrun

options:
  bundleIdPrefix: nl.foodrun
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Foodrun:
    type: application
    platform: iOS
    sources:
      - path: FoodrunApp
        excludes: ["**/*.md"]
      - path: FoodrunUI
        excludes: ["**/*.md"]
      - path: Localization
      - path: Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.foodrun.app
        PRODUCT_NAME: Foodrun
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        # No AppIcon in Assets.xcassets yet — add one before TestFlight.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Foodrun
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: nl.foodrun.app
            CFBundleURLSchemes: [foodrun]
        NSNFCReaderUsageDescription: Foodrun uses NFC to let you clock in and out by tapping the tag on your truck.
    entitlements:
      path: Supporting/Foodrun.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [NDEF]
