# XcodeGen spec — run `xcodegen generate` to (re)create Foodrun.xcodeproj.
# The .xcodeproj is generated and git-ignored; edit this file instead.
name: Foodrun

options:
  bundleIdPrefix: nl.foodrun
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0   # upload(_:data:options:) used by CrewAPI.uploadTaskPhoto

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"   # raise for every upload; builds 1–5 are in App Store Connect

targets:
  Foodrun:
    type: application
    platform: iOS
    sources:
      - path: FoodrunApp
        excludes: ["**/*.md"]
      - path: FoodrunUI
        excludes: ["**/*.md"]
      - path: Localization
      - path: Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.foodrun.app
        PRODUCT_NAME: Foodrun
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Apple Developer team "Ha Linh Tran" (paid, Individual). Set here because
        # Foodrun.xcodeproj is regenerated; picking the team in Xcode gets overwritten.
        DEVELOPMENT_TEAM: GWU44KGDJZ
        SUPPORTS_MACCATALYST: NO
        # Assets.xcassets/AppIcon.appiconset — one 1024×1024 image (the Foodrun logo,
        # full square, no transparency); Xcode makes the smaller sizes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Foodrun
        # Version and build come from MARKETING_VERSION / CURRENT_PROJECT_VERSION above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: nl.foodrun.app
            CFBundleURLSchemes: [foodrun]
        NFCReaderUsageDescription: Foodrun uses NFC to let you clock in and out by tapping the tag on your truck.
        # Photo tasks (CrewPhotoViews.swift). The library uses PhotosPicker, which needs no permission.
        NSCameraUsageDescription: Foodrun uses the camera when a task asks you for a photo, for example of your truck set-up.
        # Pin a location on the event (CrewPinViews.swift). Asked when the pin sheet opens for an event
        # without coordinates, or when the crew member taps "Mijn locatie".
        NSLocationWhenInUseUsageDescription: Foodrun uses your location when you pin a spot on the event, for example where your truck stands.
        # Background roster check for shift-change notifications (ShiftBackgroundRefresh).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [nl.foodrun.app.shift-refresh]
        # Only standard HTTPS — skips the export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Supporting/Foodrun.entitlements
      properties:
        # TAG, not NDEF: App Store uploads for iOS 13+ reject the NDEF value
        # (ITMS-90778 "NDEF is disallowed"). NFCNDEFReaderSession works with TAG.
        com.apple.developer.nfc.readersession.formats: [TAG]
        # Sign in with Apple (AuthViewRedesign). Needs a paid Apple Developer team;
        # a free personal team can't sign it — drop this line to build there.
        com.apple.developer.applesignin: [Default]
        # applinks: a scanned clock tag (https://foodrun.nl/clock/<token>) opens the app
        # (FoodrunApp.onContinueUserActivity → ScannedClockTag). webcredentials: lets
        # iOS offer to save and fill the Foodrun password. Both rely on
        # https://foodrun.nl/.well-known/apple-app-site-association (HQ repo).
        com.apple.developer.associated-domains: ["applinks:foodrun.nl", "webcredentials:foodrun.nl"]
